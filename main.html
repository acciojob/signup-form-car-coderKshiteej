<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Signup Form</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 8px 16px rgba(0, 0, 0, 0.2);
            width: 100%;
            max-width: 600px;
        }
        
        h1 {
            color: #333;
            text-align: center;
            margin-bottom: 30px;
            font-size: 28px;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            color: #333;
            font-weight: bold;
            font-size: 14px;
        }
        
        input[type="text"],
        input[type="email"],
        input[type="number"],
        input[type="date"],
        input[type="tel"],
        input[type="password"],
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
            transition: border-color 0.3s ease;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        
        input[type="text"]:focus,
        input[type="email"]:focus,
        input[type="number"]:focus,
        input[type="date"]:focus,
        input[type="tel"]:focus,
        input[type="password"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 5px rgba(102, 126, 234, 0.3);
        }
        
        .radio-group {
            display: flex;
            gap: 20px;
            margin-top: 8px;
        }
        
        .radio-group label {
            display: flex;
            align-items: center;
            margin-bottom: 0;
            font-weight: normal;
            gap: 8px;
            cursor: pointer;
        }
        
        input[type="radio"],
        input[type="checkbox"] {
            cursor: pointer;
            width: 18px;
            height: 18px;
        }
        
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
        }
        
        .checkbox-group label {
            margin-bottom: 0;
            font-weight: normal;
            cursor: pointer;
        }
        
        .submit-btn {
            width: 100%;
            padding: 12px;
            background-color: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s ease;
            margin-top: 10px;
        }
        
        .submit-btn:hover {
            background-color: #764ba2;
        }
        
        .submit-btn:active {
            transform: scale(0.98);
        }
        
        .required {
            color: #e74c3c;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Signup Form</h1>
        
        <form method="POST" action="#">
            <!-- Name Input -->
            <div class="form-group">
                <label for="name">Name <span class="required">*</span></label>
                <input 
                    type="text" 
                    id="name" 
                    name="name" 
                    placeholder="Name"
                    required
                >
            </div>
            
            <!-- Email Input -->
            <div class="form-group">
                <label for="email">Email <span class="required">*</span></label>
                <input 
                    type="email" 
                    id="email" 
                    name="email" 
                    placeholder="Email"
                    required
                >
            </div>
            
            <!-- Gender Radio Buttons -->
            <div class="form-group">
                <label>Gender <span class="required">*</span></label>
                <div class="radio-group">
                    <label>
                        <input 
                            type="radio" 
                            id="gender_m" 
                            name="gender" 
                            value="Male"
                            required
                        >
                        Male
                    </label>
                    <label>
                        <input 
                            type="radio" 
                            id="gender_f" 
                            name="gender" 
                            value="Female"
                            required
                        >
                        Female
                    </label>
                </div>
            </div>
            
            <!-- Car Brands Select -->
            <div class="form-group">
                <label for="cars">Car Brands <span class="required">*</span></label>
                <select 
                    id="cars" 
                    name="cars"
                    required
                >
                    <option value="">--Please choose an option--</option>
                    <option value="Toyota">Toyota</option>
                    <option value="Honda">Honda</option>
                    <option value="BMW">BMW</option>
                    <option value="Mercedes">Mercedes</option>
                    <option value="Audi">Audi</option>
                    <option value="Ford">Ford</option>
                    <option value="Chevrolet">Chevrolet</option>
                </select>
            </div>
            
            <!-- Age Input -->
            <div class="form-group">
                <label for="age">Age <span class="required">*</span></label>
                <input 
                    type="number" 
                    id="age" 
                    name="age" 
                    placeholder="Age"
                    required
                >
            </div>
            
            <!-- Date of Birth Input -->
            <div class="form-group">
                <label for="dob">DOB <span class="required">*</span></label>
                <input 
                    type="date" 
                    id="dob" 
                    name="dob"
                    required
                >
            </div>
            
            <!-- Phone Number Input -->
            <div class="form-group">
                <label for="tel">Phone Number</label>
                <input 
                    type="tel" 
                    id="tel" 
                    name="tel" 
                    placeholder="xxx-xxx-xxxx"
                >
            </div>
            
            <!-- Password Input -->
            <div class="form-group">
                <label for="password">Password <span class="required">*</span></label>
                <input 
                    type="password" 
                    id="password" 
                    name="password" 
                    placeholder="Password"
                    required
                >
            </div>
            
            <!-- Terms of Service Checkbox -->
            <div class="form-group">
                <div class="checkbox-group">
                    <input 
                        type="checkbox" 
                        id="tos" 
                        name="tos"
                        required
                    >
                    <label for="tos">I agree to the TOS <span class="required">*</span></label>
                </div>
            </div>
            
            <!-- Submit Button -->
            <button type="submit" class="submit-btn">Submit</button>
        </form>
    </div>
</body>
</html>
